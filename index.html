<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="form-box active" id="login-form">
            <form action="#">
                <h2>Login</h2>

                <input type="email" name="email" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>

                <div class="forgot-link">
                    <a href="#" data-form="forgot-form">Recuperar contraseña</a>
                </div>

                <button type="submit">Login</button>

                <div class="social-login">
                    <a href="#" aria-label="Google">
                        <img src="https://cdn.simpleicons.org/google" alt="Google">
                    </a>
                    <a href="#" aria-label="Facebook">
                        <img src="https://cdn.simpleicons.org/facebook" alt="Facebook">
                    </a>
                    <a href="#" aria-label="GitHub">
                        <img src="https://cdn.simpleicons.org/github" alt="GitHub">
                    </a>
                </div>

                <p>
                    ¿No tienes una cuenta?
                    <a href="#" data-form="register-form">Registrar</a>
                </p>
            </form>
        </div>

        <div class="form-box" id="register-form">
            <form action="#">
                <h2>Registrar</h2>

                <input type="text" name="name" placeholder="Nombres" required>
                <input type="email" name="email" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>

                <button type="submit">Registrar</button>

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="#" data-form="login-form">Login</a>
                </p>
            </form>
        </div>

        <div class="form-box" id="forgot-form">
            <form action="#" id="recovery-form">
                <h2>Recuperar contraseña</h2>

                <input type="email" name="email" placeholder="Correo" required>

                <button type="submit">Enviar</button>

                <p>
                    <a href="#" data-form="login-form">Volver a Login</a>
                </p>
            </form>
        </div>

        <div class="form-box" id="change-form">
            <form action="#">
                <h2>Cambiar contraseña</h2>

                <input type="email" name="email" placeholder="Correo" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <input type="password" name="repeat-password" placeholder="Repetir contraseña" required>

                <button type="submit">Aceptar</button>

                <p>
                    <a href="#" data-form="login-form">Volver a Login</a>
                </p>
            </form>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
